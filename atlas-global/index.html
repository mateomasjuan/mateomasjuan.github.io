<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas · Los países que el mundo no mira</title>
<meta name="description" content="Fichas de países que casi nunca aparecen en las noticias: quién gobierna, de qué viven, qué está pasando y cuánta libertad hay.">
<script>
  // Comparte el modo papel/noche con Despacho Global, y se aplica antes de pintar.
  try{ document.documentElement.dataset.theme = localStorage.getItem('despacho-tema') === 'noche' ? 'noche' : 'dia'; }
  catch(e){ document.documentElement.dataset.theme = 'dia'; }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css?v=2">
</head>
<body data-view="indice">

<a class="skip" href="#contenido">Saltar al contenido</a>

<header class="topbar">
  <div class="topbar__in">
    <a class="topbar__back" href="../despacho-global/index.html">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3M7 4 3 8l4 4"/></svg>
      <span>Despacho Global</span>
    </a>
    <a class="topbar__brand" href="#" aria-label="Atlas, todos los países">Atlas</a>
    <button class="theme" id="themeToggle" type="button" aria-label="Cambiar a modo noche">
      <svg class="theme__icon theme__icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
      <svg class="theme__icon theme__icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1Z"/></svg>
      <span id="themeLabel">Noche</span>
    </button>
  </div>
</header>

<main id="contenido" tabindex="-1">

  <!-- ===== Índice: todos los países ===== -->
  <div class="view" data-view="indice">
    <section class="cover" aria-labelledby="titulo">
      <div class="cover__in">
        <h1 class="cover__title" id="titulo">Atlas</h1>
        <p class="cover__lede">Los países que el mundo no mira. Uno por uno: quién manda, de qué viven, qué está pasando y cuánta libertad hay.</p>
      </div>
      <div class="worldmap" id="worldmap">
        <p class="worldmap__tip" id="worldtip" hidden></p>
      </div>
    </section>

    <section class="catalogo" aria-labelledby="h-paises">
      <div class="catalogo__head">
        <h2 id="h-paises">Elegí un país</h2>
        <div class="filtros" id="filtros" role="group" aria-label="Filtrar por región"></div>
      </div>
      <ul class="paises" id="paises"></ul>
    </section>
  </div>

  <!-- ===== Ficha de un país ===== -->
  <article class="view ficha" data-view="ficha" id="ficha" hidden></article>

</main>

<footer class="foot">
  <div class="foot__in">
    <span id="footCount">Atlas · parte de Despacho Global</span>
    <span>Fichas con fuentes y fecha de actualización. Siluetas: Natural Earth.</span>
  </div>
</footer>

<script src="vendor/d3-array.min.js"></script>
<script src="vendor/d3-geo.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="datos/paises.js?v=1"></script>
<script src="datos/formas.js?v=2"></script>
<script src="datos/mundo.js"></script>
<script src="atlas.js?v=5"></script>
</body>
</html>
